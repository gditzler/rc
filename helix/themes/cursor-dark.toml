# cursor-dark.toml — Cursor IDE dark theme for Helix
# Place in ~/.config/helix/themes/cursor-dark.toml
# Then set: theme = "cursor-dark" in ~/.config/helix/config.toml

# ── Syntax Highlighting ──────────────────────────────────────────

"attribute" = "yellow"
"type" = "teal"
"type.builtin" = "teal"
"type.enum" = "teal"
"type.enum.variant" = "teal"
"constructor" = "teal"

"constant" = "blue"
"constant.builtin" = "blue"
"constant.builtin.boolean" = "blue"
"constant.character" = "green"
"constant.character.escape" = "yellow"
"constant.numeric" = "light_green"

"string" = "orange"
"string.regexp" = "red"
"string.special" = "yellow"

"comment" = { fg = "comment", modifiers = ["italic"] }
"comment.block.documentation" = { fg = "comment", modifiers = ["italic"] }

"variable" = "fg"
"variable.builtin" = "blue"
"variable.parameter" = "parameter"
"variable.other.member" = "fg"

"label" = "blue"

"punctuation" = "subtle"
"punctuation.delimiter" = "subtle"
"punctuation.bracket" = "subtle"
"punctuation.special" = "yellow"

"keyword" = "purple"
"keyword.control" = "purple"
"keyword.control.conditional" = "purple"
"keyword.control.repeat" = "purple"
"keyword.control.import" = "purple"
"keyword.control.return" = "purple"
"keyword.control.exception" = "purple"
"keyword.operator" = "purple"
"keyword.directive" = "purple"
"keyword.function" = "blue"
"keyword.storage" = "purple"
"keyword.storage.type" = "blue"
"keyword.storage.modifier" = "purple"

"operator" = "subtle"

"function" = "yellow_fn"
"function.builtin" = "yellow_fn"
"function.macro" = "blue"
"function.special" = "yellow_fn"
"function.method" = "yellow_fn"

"tag" = "red"
"tag.attribute" = "teal"

"namespace" = "teal"

"special" = "yellow"

"markup.heading" = { fg = "blue", modifiers = ["bold"] }
"markup.heading.marker" = "subtle"
"markup.list" = "blue"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "teal", modifiers = ["underlined"] }
"markup.link.text" = "blue"
"markup.raw" = "orange"

"diff.plus" = "green"
"diff.minus" = "red"
"diff.delta" = "yellow"

# ── UI ───────────────────────────────────────────────────────────

"ui.background" = { bg = "bg" }
"ui.background.separator" = { fg = "border" }

"ui.window" = { fg = "border" }

"ui.text" = { fg = "fg" }
"ui.text.focus" = { fg = "fg_bright" }
"ui.text.inactive" = { fg = "comment" }
"ui.text.info" = { fg = "fg" }

"ui.virtual" = { fg = "guide" }
"ui.virtual.indent-guide" = { fg = "guide" }
"ui.virtual.whitespace" = { fg = "guide" }
"ui.virtual.ruler" = { bg = "ruler" }
"ui.virtual.wrap" = { fg = "guide" }
"ui.virtual.inlay-hint" = { fg = "inlay", modifiers = ["italic"] }

"ui.cursor" = { fg = "bg", bg = "cursor" }
"ui.cursor.primary" = { fg = "bg", bg = "cursor" }
"ui.cursor.insert" = { fg = "bg", bg = "fg_bright" }
"ui.cursor.select" = { fg = "bg", bg = "teal" }
"ui.cursor.match" = { fg = "yellow", bg = "highlight" }

"ui.cursorline.primary" = { bg = "cursorline" }

"ui.selection" = { bg = "selection" }
"ui.selection.primary" = { bg = "selection" }

"ui.linenr" = { fg = "linenr" }
"ui.linenr.selected" = { fg = "fg" }

"ui.statusline" = { fg = "fg", bg = "statusline" }
"ui.statusline.inactive" = { fg = "comment", bg = "bg_dark" }
"ui.statusline.normal" = { fg = "bg", bg = "blue" }
"ui.statusline.insert" = { fg = "bg", bg = "green" }
"ui.statusline.select" = { fg = "bg", bg = "purple" }
"ui.statusline.separator" = { fg = "border" }

"ui.bufferline" = { fg = "comment", bg = "bg_dark" }
"ui.bufferline.active" = { fg = "fg_bright", bg = "bg" }
"ui.bufferline.background" = { bg = "bg_dark" }

"ui.popup" = { fg = "fg", bg = "popup" }
"ui.popup.info" = { fg = "fg", bg = "popup" }

"ui.menu" = { fg = "fg", bg = "popup" }
"ui.menu.selected" = { fg = "fg_bright", bg = "selection" }
"ui.menu.scroll" = { fg = "subtle", bg = "popup" }

"ui.help" = { fg = "fg", bg = "popup" }

"ui.highlight" = { bg = "highlight" }

"ui.gutter" = { bg = "bg" }
"ui.gutter.selected" = { bg = "cursorline" }

"diagnostic.hint" = { underline = { color = "teal", style = "curl" } }
"diagnostic.info" = { underline = { color = "blue", style = "curl" } }
"diagnostic.warning" = { underline = { color = "yellow", style = "curl" } }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

"hint" = "teal"
"info" = "blue"
"warning" = "yellow"
"error" = "red"

# ── Palette ──────────────────────────────────────────────────────

[palette]

# Backgrounds
bg = "#1e1e1e"
bg_dark = "#181818"
popup = "#252526"
statusline = "#252526"
cursorline = "#2a2d2e"
selection = "#264f78"
highlight = "#3a3d41"
ruler = "#252526"
border = "#3c3c3c"

# Foregrounds
fg = "#cccccc"
fg_bright = "#d4d4d4"
subtle = "#808080"
comment = "#6a9955"
linenr = "#858585"
guide = "#404040"
inlay = "#969696"

# Cursor
cursor = "#aeafad"

# Accent Colors (Cursor/VS Code Dark+ palette)
blue = "#569cd6"
light_blue = "#9cdcfe"
purple = "#c586c0"
teal = "#4ec9b0"
green = "#6a9955"
light_green = "#b5cea8"
yellow = "#dcdcaa"
yellow_fn = "#dcdcaa"
orange = "#ce9178"
red = "#f44747"
parameter = "#9cdcfe"
